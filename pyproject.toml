[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ubuntu-start"
version = "0.3.23"
description = "Ubuntu Desktop first-run and device troubleshooting guide"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Nylander", email = "daniel@nylander.se" }]
keywords = ["ubuntu", "gnome", "desktop", "troubleshooting", "accessibility"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: GTK",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment",
  "Topic :: System :: Hardware",
]

[project.urls]
Homepage = "https://github.com/yeager/ubuntu-start"
Repository = "https://github.com/yeager/ubuntu-start"
Issues = "https://github.com/yeager/ubuntu-start/issues"

[project.scripts]
ubuntu-start = "ubuntu_start:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["ubuntu_start", "system_diagnostics", "guide_search", "first_run_state"]
include-package-data = false

[tool.setuptools.data-files]
"share/metainfo" = ["data/se.danielnylander.UbuntuStart.metainfo.xml"]
"share/icons/hicolor/512x512/apps" = ["data/se.danielnylander.UbuntuStart.png"]
"share/locale/sv/LC_MESSAGES" = ["packaging/pypi/locale/sv/LC_MESSAGES/ubuntu-start.mo"]
