name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y appstream gettext libadwaita-1-dev meson ninja-build python3-gi gir1.2-adw-1 gir1.2-gtk-4.0
      - name: Check Python syntax and GTK imports
        run: |
          python3 -m compileall -q src tests scripts
          PYTHONPATH=src python3 -c "import ubuntu_start"
      - name: Check source translation coverage
        run: python3 scripts/check-translations.py
      - name: Check Swedish translations
        run: |
          test -z "$(msgattrib --untranslated --no-obsolete po/sv.po)"
          test -z "$(msgattrib --only-fuzzy --no-obsolete po/sv.po)"
          msgfmt --check --statistics po/sv.po -o /tmp/ubuntu-start-sv.mo
      - name: Validate AppStream metadata
        run: appstreamcli validate data/se.nylander.UbuntuStart.metainfo.xml
      - name: Run unit tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: Build with Meson
        run: |
          meson setup build --prefix=/usr
          meson compile -C build
          DESTDIR="$PWD/stage" meson install -C build
          sh scripts/check-staged-install.sh "$PWD/stage"
      - name: Build and inspect Debian package
        run: |
          scripts/build-deb.sh "$PWD/build/packages"
          set -- "$PWD"/build/packages/*.deb
          test "$#" -eq 1
          package=$1
          test "$(dpkg-deb --field "$package" Architecture)" = all
          dpkg-deb --contents "$package" | grep -Fq './usr/share/applications/se.nylander.UbuntuStart.desktop'
          dpkg-deb --contents "$package" | grep -Fq './usr/share/icons/hicolor/512x512/apps/se.nylander.UbuntuStart.png'
      - name: Build Python distributions
        run: |
          sh scripts/build-python-dist.sh
          python3 -m venv build/package-venv
          build/package-venv/bin/pip install --disable-pip-version-check build setuptools wheel twine
          build/package-venv/bin/python -m build --no-isolation --outdir build/python-distributions
          build/package-venv/bin/python -m twine check build/python-distributions/*
