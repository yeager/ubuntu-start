name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify release tag matches project metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import xml.etree.ElementTree as ET

          tag_version = os.environ["RELEASE_TAG"].removeprefix("v")
          project_text = open("meson.build", encoding="utf-8").read()
          project_version = re.search(r"version: '([^']+)'", project_text).group(1)
          appstream_version = ET.parse("data/se.nylander.UbuntuStart.metainfo.xml").getroot().find("releases/release").get("version")
          assert tag_version == project_version == appstream_version, (tag_version, project_version, appstream_version)
          PY
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y appstream at-spi2-core gettext gir1.2-atspi-2.0 gir1.2-adw-1 gir1.2-gtk-4.0 libadwaita-1-dev meson ninja-build python3-gi xdotool xvfb
      - name: Check Python syntax and GTK imports
        run: |
          python3 -m compileall -q src tests scripts
          PYTHONPATH=src python3 -c "import ubuntu_start"
      - name: Check source translation coverage
        run: python3 scripts/check-translations.py
      - name: Validate configured translations
        run: |
          while IFS= read -r language || [ -n "$language" ]; do
            case "$language" in ''|'#'*) continue ;; esac
            catalog="po/$language.po"
            test -z "$(msgattrib --untranslated --no-obsolete "$catalog")"
            test -z "$(msgattrib --only-fuzzy --no-obsolete "$catalog")"
            msgfmt --check --check-format --statistics "$catalog" -o "/tmp/ubuntu-start-$language.mo"
          done < po/LINGUAS
      - name: Validate AppStream metadata
        run: appstreamcli validate data/se.nylander.UbuntuStart.metainfo.xml
      - name: Run unit tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: Check app accessibility and keyboard focus
        run: xvfb-run -a dbus-run-session -- python3 scripts/check-accessibility.py
      - name: Check Swedish app localization through AT-SPI
        run: xvfb-run -a dbus-run-session -- python3 scripts/check-accessibility.py --localized-smoke sv
      - name: Build and verify staged installation
        run: |
          meson setup build --prefix=/usr
          meson compile -C build
          DESTDIR="$PWD/stage" meson install -C build
          sh scripts/check-staged-install.sh "$PWD/stage"
      - name: Build Debian package
        run: scripts/build-deb.sh "$PWD/release-assets"
      - name: Create source archive
        run: |
          git archive --format=tar.gz --prefix="ubuntu-start-${GITHUB_REF_NAME#v}/" HEAD > "release-assets/ubuntu-start-${GITHUB_REF_NAME#v}.tar.gz"
          (cd release-assets && sha256sum ubuntu-start-*.tar.gz ubuntu-start_*.deb > SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/ubuntu-start-*.tar.gz release-assets/ubuntu-start_*.deb release-assets/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/ubuntu-start-*.tar.gz release-assets/ubuntu-start_*.deb release-assets/SHA256SUMS --title "Ubuntu Start $GITHUB_REF_NAME" --generate-notes
          fi

  pypi-publish:
    needs: release
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext
          python3 -m venv build/package-venv
          build/package-venv/bin/pip install --disable-pip-version-check build setuptools wheel
      - name: Build Python distributions
        run: |
          sh scripts/build-python-dist.sh
          build/package-venv/bin/python -m build --no-isolation --outdir dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
