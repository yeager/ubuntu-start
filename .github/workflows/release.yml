name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify release tag matches project metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import xml.etree.ElementTree as ET

          tag_version = os.environ["RELEASE_TAG"].removeprefix("v")
          project_text = open("meson.build", encoding="utf-8").read()
          project_version = re.search(r"version: '([^']+)'", project_text).group(1)
          appstream_version = ET.parse("data/se.nylander.UbuntuStart.metainfo.xml").getroot().find("releases/release").get("version")
          assert tag_version == project_version == appstream_version, (tag_version, project_version, appstream_version)
          PY
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y appstream gettext libadwaita-1-dev meson ninja-build python3-gi gir1.2-adw-1 gir1.2-gtk-4.0
      - name: Validate translations
        run: |
          test -z "$(msgattrib --untranslated --no-obsolete po/sv.po)"
          test -z "$(msgattrib --only-fuzzy --no-obsolete po/sv.po)"
          msgfmt --check --statistics po/sv.po -o /tmp/ubuntu-start-sv.mo
      - name: Validate AppStream metadata
        run: appstreamcli validate data/se.nylander.UbuntuStart.metainfo.xml
      - name: Run unit tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: Build and verify staged installation
        run: |
          meson setup build --prefix=/usr
          meson compile -C build
          DESTDIR="$PWD/stage" meson install -C build
          sh scripts/check-staged-install.sh "$PWD/stage"
      - name: Create source archive
        run: |
          git archive --format=tar.gz --prefix=ubuntu-start-${GITHUB_REF_NAME#v}/ HEAD > "ubuntu-start-${GITHUB_REF_NAME#v}.tar.gz"
          sha256sum ubuntu-start-*.tar.gz > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ubuntu-start-*.tar.gz SHA256SUMS --title "Ubuntu Start $GITHUB_REF_NAME" --generate-notes
